<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" font-family="Arial, Helvetica, sans-serif">
<title>SAP and Business Command Centre integration flows</title>
<desc>Flow A: SAP calls the Business Command Centre to fetch orders and post results. Flow B: the Business Command Centre calls SAP ZEE_API_LOG with a Sales Order number.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444441" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="450" fill="#ffffff"/>
<rect x="40" y="16" width="160" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
<text x="120" y="43" text-anchor="middle" font-size="14" font-weight="bold" fill="#3C3489">SAP</text>
<rect x="450" y="16" width="220" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
<text x="560" y="43" text-anchor="middle" font-size="14" font-weight="bold" fill="#085041">Business Command Centre</text>
<line x1="120" y1="60" x2="120" y2="430" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="3 3"/>
<line x1="560" y1="60" x2="560" y2="430" stroke="#B4B2A9" stroke-width="0.75" stroke-dasharray="3 3"/>
<rect x="20" y="76" width="640" height="196" rx="12" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="340" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Flow A: SAP calls the Business Command Centre (main flow)</text>
<g font-size="12" fill="#5F5E5A" text-anchor="middle">
<text x="340" y="138">GET /orders</text>
<text x="340" y="178">approved orders, as JSON</text>
<text x="340" y="218">POST /results (raw JSON, SUCCESS or ERROR)</text>
<text x="340" y="248">200 accepted, or 400 BODY_NOT_JSON / 415</text>
</g>
<g stroke="#444441" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
<line x1="124" y1="146" x2="556" y2="146"/>
<line x1="556" y1="186" x2="124" y2="186"/>
<line x1="124" y1="226" x2="556" y2="226"/>
<line x1="556" y1="256" x2="124" y2="256"/>
</g>
<rect x="20" y="292" width="640" height="128" rx="12" fill="none" stroke="#888780" stroke-width="0.75" stroke-dasharray="4 4"/>
<text x="340" y="318" text-anchor="middle" font-size="14" font-weight="bold" fill="#2C2C2A">Flow B: Business Command Centre calls SAP (optional, off by default)</text>
<g font-size="12" fill="#5F5E5A" text-anchor="middle">
<text x="340" y="350">ZEE_API_LOG with IT_SALEORDERS / VBELN</text>
<text x="340" y="392">SAP log for that Sales Order</text>
</g>
<g stroke="#444441" stroke-width="1.5" fill="none" stroke-dasharray="5 4" marker-end="url(#arrow)">
<line x1="556" y1="358" x2="124" y2="358"/>
<line x1="124" y1="400" x2="556" y2="400"/>
</g>
</svg>
