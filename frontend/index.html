<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Review extracted purchase orders and approve them for Sales Order creation in SAP S/4HANA." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />

    <!-- The Millennium Semiconductors planet mark. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#70284e" />

    <title>Millennium Semiconductors · Business Command Centre</title>

    <script>
      // Resolve the theme before first paint. Light is this tool's designed case;
      // dark is offered, but only an explicit choice or an OS dark preference gets it.
      (function () {
        try {
          var stored = localStorage.getItem('cockpit.theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
